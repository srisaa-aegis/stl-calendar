<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>stl-calendar demo</title>
<link rel="stylesheet" href="../src/style.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; color: #1f2937; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid #e5e7eb; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  header label { font-size: 13px; display: flex; gap: 4px; align-items: center; }
  header button { font-size: 13px; padding: 4px 10px; cursor: pointer; }
  #c { flex: 1; min-height: 0; margin: 10px 16px; }
  #log { font: 12px/1.4 ui-monospace, monospace; background: #f9fafb; border-top: 1px solid #e5e7eb; padding: 6px 16px; height: 90px; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>stl-calendar</h1>
  <label>View
    <select id="view"><option>month</option><option>week</option><option>day</option></select>
  </label>
  <label><input type="checkbox" id="panel" checked /> Task panel</label>
  <label><input type="checkbox" id="ro" /> Read only</label>
  <label><input type="checkbox" id="fail" /> Make saves fail</label>
  <button id="reset">Reset sample</button>
  <span style="font-size:12px;color:#6b7280">Click a day or drag over days (month) / time slots (week, day) to create; click an item to edit; tick a task in the panel to close it.</span>
</header>
<div id="c"></div>
<div id="log">Edits made in the calendar are reported here (the library never saves anything itself).</div>
<script src="./calendar.js"></script>
</body>
</html>
